<div class="task-form-page">
  <a routerLink="/tasks" class="back-link">&larr; Back to tasks</a>

  <h1>{{ editingId() ? 'Edit Task' : 'New Task' }}</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" formControlName="title" placeholder="e.g. Build login page" />
      @if (f.title.invalid && f.title.touched) {
        <span class="error">Title must be at least 3 characters.</span>
      }
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea
        id="description"
        rows="4"
        formControlName="description"
        placeholder="What needs to be done?"
      ></textarea>
      @if (f.description.invalid && f.description.touched) {
        <span class="error">Description is required (max 300 characters).</span>
      }
    </div>

    <div class="field-row">
      <div class="field">
        <label for="status">Status</label>
        <select id="status" formControlName="status">
          <option value="todo">To do</option>
          <option value="in-progress">In progress</option>
          <option value="done">Done</option>
        </select>
      </div>

      <div class="field">
        <label for="priority">Priority</label>
        <select id="priority" formControlName="priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <a routerLink="/tasks" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">
        {{ editingId() ? 'Save Changes' : 'Create Task' }}
      </button>
    </div>
  </form>
</div>
